services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-connect_sphere}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-connect_sphere}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: "postgresql://${POSTGRES_USER:-connect_sphere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-connect_sphere}"
      DATABASE_SSL: "false"
      TRUST_PROXY: "1"
      TURNIX_API_TOKEN: "${TURNIX_API_TOKEN:-}"
      STUN_URLS: "${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}"
      TURN_URL: "${TURN_URL:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-}"
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:-}"
      WEBRTC_STUN_SERVERS: "${WEBRTC_STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}"
      WEBRTC_TURN_SERVERS: "${WEBRTC_TURN_SERVERS:-}"
      WEBRTC_TURN_USERNAME: "${WEBRTC_TURN_USERNAME:-}"
      WEBRTC_TURN_CREDENTIAL: "${WEBRTC_TURN_CREDENTIAL:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
    command: sh -c "node apps/api/dist/db/migrate.js && node apps/api/dist/server.js"

  turn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-connectsphere}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-}
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"

volumes:
  pgdata:
